<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Manya Bangles</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-login-page">
  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo-wrap">
      <img src="assets/logo.jpg" alt="Manya Bangles" class="login-logo">
      <div class="login-brand" id="login-brand">Manya Bangles</div>
      <div class="login-subtitle">Admin Dashboard</div>
    </div>
    <!-- Error message -->
    <div class="login-error" id="login-error" role="alert"></div>
    <!-- Demo mode notice -->
    <div id="demo-notice" style="
      background: rgba(201,168,76,0.12);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 12px;
      color: #EDD98A;
      margin-bottom: 20px;
      display: none;
      line-height: 1.5;
    ">
      ⚠️ <strong>Demo Mode</strong> — Firebase is not configured. The admin login won't work until you set up Firebase. See <code style="font-size:11px">js/firebase-config.js</code> for setup instructions.
    </div>
    <!-- Login Form -->
    <form class="login-form" id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="admin-email">Email Address</label>
        <input
          type="email"
          id="admin-email"
          class="form-input"
          placeholder="admin@manyabangles.com"
          required
          autocomplete="email"
        >
      </div>
      <div class="form-group">
        <label class="form-label" for="admin-password">Password</label>
        <div style="position:relative">
          <input
            type="password"
            id="admin-password"
            class="form-input"
            placeholder="••••••••"
            required
            autocomplete="current-password"
            style="padding-right:44px"
          >
          <button
            type="button"
            onclick="togglePasswordVisibility()"
            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.4);font-size:18px"
            id="pwd-toggle-btn"
            aria-label="Toggle password visibility"
          >👁</button>
        </div>
      </div>
      <button
        type="submit"
        class="btn btn-gold btn-block"
        id="login-submit-btn"
        style="margin-top:8px"
      >
        <span id="login-btn-text">Sign In to Dashboard</span>
        <span id="login-btn-spinner" style="display:none">
          <div class="spinner" style="width:18px;height:18px;border-width:2px;"></div>
        </span>
      </button>
    </form>
    <div class="login-divider">Secure Admin Area</div>
    <p style="text-align:center;font-size:12px;color:rgba(255,255,255,0.25);line-height:1.6">
      🔒 This page is restricted to authorized business owners only.<br>
      <a href="index.html" style="color:rgba(201,168,76,0.6);text-decoration:underline">Go to Customer Storefront →</a>
    </p>
  </div>
</div>
<!-- Toast container -->
<div id="toast-container"></div>
<script src="js/firebase-config.js"></script>
<script src="js/admin-auth.js"></script>
<script>
  // Show demo notice if not configured
  if (typeof DEMO_MODE !== 'undefined' && DEMO_MODE) {
    document.getElementById('demo-notice').style.display = 'block';
  }
  function togglePasswordVisibility() {
    const pwd = document.getElementById('admin-password');
    const btn = document.getElementById('pwd-toggle-btn');
    if (pwd.type === 'password') {
      pwd.type = 'text';
      btn.textContent = '🙈';
    } else {
      pwd.type = 'password';
      btn.textContent = '👁';
    }
  }
</script>
</body>
</html>
